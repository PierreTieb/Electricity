<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B9BDC2">
<title>L'électricité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="home">

  <!-- ÉCRAN : ACCUEIL -->
  <section id="screen-home" class="screen active">
    <h1 class="app-title">L'électricité</h1>
    <p class="app-subtitle">Tout ce qu'il faut savoir sur l'électricité au collège</p>

    <div class="mode-list">
      <button type="button" id="btn-lessons" class="mode-btn mode-btn--bronze mode-btn--icon" aria-disabled="true">
        <span class="mode-btn__title">Leçons</span>
        <span class="mode-btn__subtitle">Prochainement...</span>
        <svg class="mode-btn__ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 10q8-3 16 2v28q-8-5-16-2z" fill="#fff" fill-opacity=".55"/><path d="M40 10q-8-3-16 2v28q8-5 16-2z" fill="#fff" fill-opacity=".35"/><path d="M8 10q8-3 16 2 8-5 16-2v28q-8-3-16 2-8-5-16-2z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 12v28" stroke="currentColor" stroke-width="2.2"/></svg>
      </button>
      <button type="button" id="btn-lab" class="mode-btn mode-btn--silver mode-btn--icon">
        <span class="mode-btn__title">Laboratoire</span>
        <span class="mode-btn__subtitle">Un espace libre pour tester les propriétés de l'électricité</span>
        <svg class="mode-btn__ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="21" r="12" fill="#FFF3B8" stroke="currentColor" stroke-width="2.6"/><path d="M19 32h10v5a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z" fill="#fff" fill-opacity=".55" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 22l2.5 3 1.5-5 1.5 5 2.5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" id="btn-challenge" class="mode-btn mode-btn--gold mode-btn--icon" aria-disabled="true">
        <span class="mode-btn__title">Challenge</span>
        <span class="mode-btn__subtitle">Prochainement...</span>
        <span class="mode-btn__trophy" aria-hidden="true">🏆</span>
      </button>
    </div>
  </section>

  <!-- ÉCRAN : LABORATOIRE -->
  <section id="screen-lab" class="screen screen--lab">
    <div class="lab-head">
      <button type="button" class="btn-back" id="btn-back-lab">← Retour</button>
      <div class="lab-head__titles">
        <h1 class="app-title app-title--small">Laboratoire</h1>
        <p class="app-subtitle app-subtitle--tight">Un espace libre pour tester les propriétés de l'électricité</p>
      </div>
    </div>

    <div class="lab-options">
      <label class="chk"><input type="checkbox" id="opt-schema"><span class="chk__box" aria-hidden="true"></span>Vue schéma</label>
      <label class="chk"><input type="checkbox" id="opt-current"><span class="chk__box" aria-hidden="true"></span>Sens du courant</label>
      <label class="chk"><input type="checkbox" id="opt-electrons"><span class="chk__box" aria-hidden="true"></span>Électrons</label>
      <button type="button" class="btn-clear" id="btn-clear" aria-label="Tout effacer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Tout effacer</span></button>
    </div>

    <div class="lab-main">
      <div class="ws" id="ws">
        <svg id="ws-svg" class="ws-svg" role="application" aria-label="Plan de travail du circuit électrique"></svg>
        <div class="ws-hint" id="ws-hint">Choisis un élément dans la barre de droite<br>puis relie les bornes en tirant un fil.</div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </div>

      <aside class="bar" id="bar" aria-label="Éléments disponibles">
        <div class="bar__tabs" role="tablist">
          <button type="button" role="tab" class="bar__tab" data-tab="dipoles" aria-selected="true">Dipôles</button>
          <button type="button" role="tab" class="bar__tab" data-tab="mesures" aria-selected="false">Mesures</button>
        </div>
        <div class="bar__list" id="bar-list"></div>
        <div class="bar__trash" aria-hidden="true">Relâche pour retirer</div>
      </aside>
    </div>

    <!-- Fenêtre « ? » -->
    <div class="pop-overlay" id="pop" hidden>
      <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="pop-title">
        <div class="pop-head">
          <svg class="pop-ico" id="pop-ico" viewBox="-60 -50 120 100" aria-hidden="true"></svg>
          <h2 class="pop-title" id="pop-title"></h2>
        </div>
        <div class="pop-body" id="pop-body"></div>
        <div class="ex-actions"><button type="button" class="btn-primary" id="pop-close">Fermer</button></div>
      </div>
    </div>
  </section>

  <script src="js/components.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
